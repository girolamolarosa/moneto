<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080c14">
<title>Moneto Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
  --color-bg:#080c14;--color-surface:#111827;--color-surface-2:#1c2438;
  --color-border:rgba(255,255,255,0.07);--color-accent:#00c9b8;
  --color-income:#00d97e;--color-expense:#ff4d6d;
  --color-text:#f0f2f8;--color-text-muted:#6b7a99;
  --color-hero-top:#00c9b8;--color-hero-bottom:#080c14;
  --shadow-card:0 4px 24px rgba(0,0,0,.55);--shadow-sm:0 2px 10px rgba(0,0,0,.3);
  --radius-card:20px;--radius-input:12px;
  --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  --tab-height:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--color-bg);color:var(--color-text);font-family:Inter,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;padding-top:var(--safe-top);padding-bottom:calc(var(--tab-height) + var(--safe-bottom));overflow-y:auto;overflow-x:hidden}
.view{display:none;padding:1rem 1rem .5rem;animation:fadeIn .2s ease}
.view.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.bottom-tabs{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-height) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--color-bg);box-shadow:0 -1px 0 rgba(255,255,255,.06);display:flex;z-index:100}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;color:var(--color-text-muted);font-size:10px;font-weight:500;font-family:inherit;cursor:pointer;position:relative;transition:color .2s;padding-bottom:2px}
.tab-item.active{color:var(--color-accent)}
.tab-item.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:28px;height:3px;border-radius:0 0 4px 4px;background:var(--color-accent)}
.tab-icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero-card{background:linear-gradient(145deg,var(--color-hero-top) 0%,#006e65 55%,var(--color-hero-bottom) 100%);border-radius:var(--radius-card);padding:1.75rem 1.25rem 1.5rem;margin-bottom:1rem;text-align:center;box-shadow:0 8px 32px rgba(0,201,184,.25);position:relative;overflow:hidden}
.hero-label{font-size:.7rem;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.08em;margin-bottom:.3rem}
.hero-amount{font-size:clamp(2rem,8vw,2.6rem);font-weight:800;color:#fff;line-height:1.1;margin:.1rem 0;letter-spacing:-.02em}
.hero-sub{font-size:.72rem;color:rgba(255,255,255,.45);margin-top:.4rem}
.card{background:var(--color-surface);border-radius:var(--radius-card);padding:1.1rem;margin-bottom:.75rem;box-shadow:var(--shadow-card)}
.card-title{font-size:.7rem;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.6rem}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.kpi{background:var(--color-surface);border-radius:var(--radius-card);padding:1rem;box-shadow:var(--shadow-card)}
.kpi-label{font-size:.7rem;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.07em}
.kpi-value{font-size:1.35rem;font-weight:700;margin-top:.25rem}
.kpi-value.pos{color:var(--color-income)}.kpi-value.neg{color:var(--color-expense)}.kpi-value.neu{color:var(--color-text-muted)}
.badge-ok{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(0,217,126,.15);color:var(--color-income)}
.badge-attenzione{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(245,158,11,.15);color:#f59e0b}
.badge-alert{display:inline-flex;align-items:center;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(255,77,109,.15);color:var(--color-expense)}
.form-group{margin-bottom:1rem}
.form-label{display:block;font-size:.72rem;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
.form-control{width:100%;padding:.75rem 1rem;background:rgba(255,255,255,.05);border:none;border-radius:var(--radius-input);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--color-text);font-size:15px;font-family:inherit;outline:none;transition:box-shadow .2s}
.form-control:focus{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.form-control::placeholder{color:var(--color-text-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.form-sep{height:1px;background:rgba(255,255,255,.07);margin:1rem 0}
.btn-primary{width:100%;padding:.85rem;background:var(--color-accent);color:#fff;border:none;border-radius:var(--radius-input);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:opacity .2s}
.btn-primary:active{opacity:.85}
.month-row{display:flex;align-items:center;gap:.75rem;padding:.85rem .9rem;background:var(--color-surface);border-radius:16px;margin-bottom:.5rem;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s}
.month-row:active{background:var(--color-surface-2)}
.month-row-left{flex:1;min-width:0}
.month-row-name{font-size:14px;font-weight:600}
.month-row-total{font-size:13px;color:var(--color-text-muted);margin-top:1px}
.month-row-right{text-align:right;flex-shrink:0}
.month-row-var{font-size:14px;font-weight:700}
.month-row-var.pos{color:var(--color-income)}.month-row-var.neg{color:var(--color-expense)}.month-row-var.neu{color:var(--color-text-muted)}
.chart-wrap{background:var(--color-surface);border-radius:var(--radius-card);padding:1rem;margin-bottom:.75rem;box-shadow:var(--shadow-card)}
.chart-label{font-size:.7rem;font-weight:600;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem}
.chart-container{position:relative;height:180px}
.page-header{padding:.5rem 0 .75rem;display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:1.1rem;font-weight:800;color:var(--color-text)}
.page-subtitle{font-size:.75rem;color:var(--color-text-muted);margin-top:1px}
.trend-row{display:flex;justify-content:space-between;align-items:center;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.05)}
.trend-row:last-child{border-bottom:none}
.trend-label{font-size:13px;color:var(--color-text-muted)}
.trend-value{font-size:13px;font-weight:700}
.trend-value.pos{color:var(--color-income)}.trend-value.neg{color:var(--color-expense)}.trend-value.neu{color:var(--color-text-muted)}
.month-select{flex:1;padding:.65rem .75rem;background:rgba(255,255,255,.05);border:none;border-radius:var(--radius-input);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:var(--color-text);font-size:14px;font-family:inherit;appearance:none;outline:none}
.month-select option{background:#1c2438}
.month-picker-row{display:flex;gap:.5rem;margin-bottom:1.25rem}
.empty-msg{text-align:center;padding:2.5rem 1rem;color:var(--color-text-muted);font-size:14px}
</style>
</head>
<body>
<div id="app">
  <div id="view-dashboard" class="view active"></div>
  <div id="view-inserisci" class="view"></div>
  <div id="view-storico" class="view"></div>
  <div id="view-grafici" class="view"></div>
  <div id="view-parametri" class="view"></div>
</div>
<nav class="bottom-tabs">
  <button class="tab-item active" data-view="dashboard">
    <svg class="tab-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span>Home</span>
  </button>
  <button class="tab-item" data-view="inserisci">
    <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    <span>Inserisci</span>
  </button>
  <button class="tab-item" data-view="storico">
    <svg class="tab-icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    <span>Storico</span>
  </button>
  <button class="tab-item" data-view="grafici">
    <svg class="tab-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    <span>Grafici</span>
  </button>
  <button class="tab-item" data-view="parametri">
    <svg class="tab-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
    <span>Param</span>
  </button>
</nav>
<script>
const MCC = {};

MCC.getParametri = function(){
  var def = { soglia_minima_liquidita:10000, rata_mutuo_mensile:920, fondo_sicurezza:5000, tolleranza_giallo:0.10, nomi:{bp:'BP',libretto:'Libretto',ing:'ING'} };
  try{ var s = localStorage.getItem('mcc.parametri'); return s ? Object.assign({},def,JSON.parse(s)) : def; } catch(e){ return def; }
};
MCC.setParametri = function(p){ localStorage.setItem('mcc.parametri', JSON.stringify(p)); };

MCC.getSaldi = function(){
  try{ return JSON.parse(localStorage.getItem('mcc.saldi') || '[]'); } catch(e){ return []; }
};
MCC.setSaldi = function(s){ localStorage.setItem('mcc.saldi', JSON.stringify(s)); };

MCC.getImpegni = function(){
  try{ return JSON.parse(localStorage.getItem('mcc.impegni') || '[]'); } catch(e){ return []; }
};
MCC.setImpegni = function(s){ localStorage.setItem('mcc.impegni', JSON.stringify(s)); };

MCC.upsertSaldo = function(mese, bp, libretto, ing, note){
  var arr = MCC.getSaldi();
  var idx = arr.findIndex(function(s){ return s.mese === mese; });
  var rec = { mese:mese, bp:bp, libretto:libretto, ing:ing, note:note||'' };
  if(idx >= 0){ arr[idx] = rec; } else { arr.push(rec); }
  MCC.setSaldi(arr);
};
MCC.upsertImpegno = function(mese, rata, ric, str){
  var arr = MCC.getImpegni();
  var idx = arr.findIndex(function(i){ return i.mese === mese; });
  var rec = { mese:mese, rata_mutuo:rata, spese_ricorrenti:ric, spese_straordinarie:str };
  if(idx >= 0){ arr[idx] = rec; } else { arr.push(rec); }
  MCC.setImpegni(arr);
};

MCC.calcolaTutti = function(){
  var saldi = MCC.getSaldi().slice().sort(function(a,b){ return a.mese.localeCompare(b.mese); });
  var impegni = MCC.getImpegni();
  var p = MCC.getParametri();
  return saldi.map(function(s, i){
    var tot = (s.bp||0) + (s.libretto||0) + (s.ing||0);
    var prevTot = i > 0 ? ((saldi[i-1].bp||0)+(saldi[i-1].libretto||0)+(saldi[i-1].ing||0)) : null;
    var vt = prevTot !== null ? tot - prevTot : null;
    var vbp = i > 0 ? (s.bp||0)-(saldi[i-1].bp||0) : null;
    var vlib = i > 0 ? (s.libretto||0)-(saldi[i-1].libretto||0) : null;
    var ving = i > 0 ? (s.ing||0)-(saldi[i-1].ing||0) : null;
    var perc = (prevTot !== null && prevTot !== 0) ? vt/Math.abs(prevTot) : null;
    var imp = impegni.find(function(x){ return x.mese === s.mese; }) || {rata_mutuo:0,spese_ricorrenti:0,spese_straordinarie:0};
    var totImp = (imp.rata_mutuo||0)+(imp.spese_ricorrenti||0)+(imp.spese_straordinarie||0);
    var liq = tot - totImp;
    var soglia = p.soglia_minima_liquidita;
    var alert = liq < soglia ? 'ALERT' : liq < soglia*(1+p.tolleranza_giallo) ? 'Attenzione' : 'OK';
    var t6 = i >= 6 ? tot-((saldi[i-6].bp||0)+(saldi[i-6].libretto||0)+(saldi[i-6].ing||0)) : null;
    var t12 = i >= 12 ? tot-((saldi[i-12].bp||0)+(saldi[i-12].libretto||0)+(saldi[i-12].ing||0)) : null;
    return { mese:s.mese, bp:s.bp||0, libretto:s.libretto||0, ing:s.ing||0, note:s.note||'',
      totale:tot, var_bp:vbp, var_libretto:vlib, var_ing:ving, var_totale:vt, perc_var:perc,
      stato:vt===null?null:(vt>=0?'Crescita':'Perdita'),
      imp:imp, tot_impegni:totImp, liquidita:liq, delta_soglia:liq-soglia, alert:alert,
      trend_6m:t6, trend_12m:t12 };
  });
};

(function(){
  if(MCC.getSaldi().length > 0) return;
  var s = [
    {mese:'2025-01',bp:28100,libretto:2684,ing:2373,note:''},
    {mese:'2025-02',bp:28337,libretto:2684,ing:4373,note:''},
    {mese:'2025-03',bp:28337,libretto:1484.91,ing:4100,note:''},
    {mese:'2025-04',bp:28565,libretto:1489.54,ing:1990,note:''},
    {mese:'2025-05',bp:28692,libretto:1512.58,ing:490,note:''},
    {mese:'2025-06',bp:29000,libretto:1520.65,ing:316,note:''},
    {mese:'2025-07',bp:28728,libretto:1620.65,ing:316,note:''},
    {mese:'2025-08',bp:24904,libretto:1620.65,ing:1200,note:''},
    {mese:'2025-09',bp:14570,libretto:520,ing:2470,note:'Acquisto Casa'},
    {mese:'2025-10',bp:13600,libretto:550,ing:3300,note:''},
    {mese:'2025-11',bp:12650,libretto:580,ing:2050,note:'Prima rata mutuo'},
    {mese:'2025-12',bp:12900,libretto:610,ing:1839,note:''},
    {mese:'2026-01',bp:13000,libretto:642,ing:1570,note:''},
    {mese:'2026-02',bp:12500,libretto:672,ing:1570,note:''},
    {mese:'2026-03',bp:12830,libretto:702,ing:1620,note:''}
  ];
  MCC.setSaldi(s);
  var imp = s.map(function(x){ return { mese:x.mese, rata_mutuo:x.mese>='2025-11'?920:0, spese_ricorrenti:0, spese_straordinarie:0 }; });
  MCC.setImpegni(imp);
  if(!localStorage.getItem('mcc.parametri')) MCC.setParametri({ soglia_minima_liquidita:10000, rata_mutuo_mensile:920, fondo_sicurezza:5000, tolleranza_giallo:0.10, nomi:{bp:'BP',libretto:'Libretto',ing:'ING'} });
})();
MCC.renderDashboard = function(){
  var el = document.getElementById('view-dashboard');
  var tutti = MCC.calcolaTutti();
  if(!tutti.length){ el.innerHTML = '<div class="empty-msg">Nessun dato. Vai su Inserisci per aggiungere il primo mese.</div>'; return; }
  var m = tutti[tutti.length-1];
  var p = MCC.getParametri();
  var nomi = (p.nomi)||{bp:'BP',libretto:'Libretto',ing:'ING'};
  var fmt = function(v){ return (v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var fmtS = function(v){ return v===null?'\u2014':(v>=0?'+':'')+fmt(v); };
  var fmtM = function(s){ return new Date(s+'-01').toLocaleString('it-IT',{month:'long',year:'numeric'}); };
  var vCls = m.var_totale===null?'neu':m.var_totale>=0?'pos':'neg';
  var vArrow = m.var_totale===null?'':m.var_totale>=0?'\u2191':'\u2193';
  var badge = m.alert==='OK'?'<span class="badge-ok">OK</span>':m.alert==='Attenzione'?'<span class="badge-attenzione">\u26A0\uFE0F Attenzione</span>':'<span class="badge-alert">\u26A0\uFE0F ALERT</span>';
  var t6Cls = m.trend_6m===null?'neu':m.trend_6m>=0?'pos':'neg';
  var t12Cls = m.trend_12m===null?'neu':m.trend_12m>=0?'pos':'neg';
  el.innerHTML =
    '<div class="page-header"><div><div class="page-title">Moneto Light</div><div class="page-subtitle">Aggiornato: '+fmtM(m.mese)+'</div></div>'+badge+'</div>'+
    '<div class="hero-card">'+
      '<div class="hero-label">Totale Conti</div>'+
      '<div class="hero-amount">'+fmt(m.totale)+' \u20AC</div>'+
      '<div class="hero-sub">'+(m.stato||'Primo mese')+(m.var_totale!==null?' &nbsp;'+vArrow+' '+fmt(Math.abs(m.var_totale))+' \u20AC':'')+'</div>'+
    '</div>'+
    '<div class="kpi-row">'+
      '<div class="kpi"><div class="kpi-label">Liquidit\u00E0 netta</div><div class="kpi-value '+(m.liquidita>=p.soglia_minima_liquidita?'pos':'neg')+'">'+fmt(m.liquidita)+'</div></div>'+
      '<div class="kpi"><div class="kpi-label">Var. mese</div><div class="kpi-value '+vCls+'">'+fmtS(m.var_totale)+'</div></div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Conti</div>'+
      '<div class="trend-row"><span class="trend-label">'+nomi.bp+'</span><span class="trend-value">'+fmt(m.bp)+' \u20AC</span></div>'+
      '<div class="trend-row"><span class="trend-label">'+nomi.libretto+'</span><span class="trend-value">'+fmt(m.libretto)+' \u20AC</span></div>'+
      '<div class="trend-row"><span class="trend-label">'+nomi.ing+'</span><span class="trend-value">'+fmt(m.ing)+' \u20AC</span></div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Trend patrimonio</div>'+
      '<div class="trend-row"><span class="trend-label">6 mesi</span><span class="trend-value '+t6Cls+'">'+(m.trend_6m!==null?fmtS(m.trend_6m)+' \u20AC':'n.d. (meno di 7 mesi)')+'</span></div>'+
      '<div class="trend-row"><span class="trend-label">12 mesi</span><span class="trend-value '+t12Cls+'">'+(m.trend_12m!==null?fmtS(m.trend_12m)+' \u20AC':'n.d. (meno di 13 mesi)')+'</span></div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Impegni '+(m.mese?fmtM(m.mese):'')+'</div>'+
      '<div class="trend-row"><span class="trend-label">Rata mutuo</span><span class="trend-value">'+fmt(m.imp.rata_mutuo||0)+' \u20AC</span></div>'+
      '<div class="trend-row"><span class="trend-label">Spese ricorrenti</span><span class="trend-value">'+fmt(m.imp.spese_ricorrenti||0)+' \u20AC</span></div>'+
      '<div class="trend-row"><span class="trend-label">Spese straord.</span><span class="trend-value">'+fmt(m.imp.spese_straordinarie||0)+' \u20AC</span></div>'+
      '<div class="trend-row"><span class="trend-label" style="font-weight:700;color:var(--color-text)">Totale impegni</span><span class="trend-value neg">'+fmt(m.tot_impegni)+' \u20AC</span></div>'+
    '</div>';
};
MCC.renderInserisci = function(editMese){
  var el = document.getElementById('view-inserisci');
  var pr = MCC.getParametri();
  var nomi = pr.nomi||{bp:'BP',libretto:'Libretto',ing:'ING'};
  var now = new Date();
  var defMese = editMese || (now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'));
  var defY = defMese.split('-')[0];
  var defM = defMese.split('-')[1];
  var mnames = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  var mOpts = mnames.map(function(n,i){ var v=String(i+1).padStart(2,'0'); return '<option value="'+v+'"'+(v===defM?' selected':'')+'>'+n+'</option>'; }).join('');
  var yOpts = '';
  for(var y=2023;y<=now.getFullYear()+2;y++){ yOpts += '<option value="'+y+'"'+(String(y)===defY?' selected':'')+'>'+y+'</option>'; }
  var existS = MCC.getSaldi().find(function(s){ return s.mese===defMese; })||{};
  var existI = MCC.getImpegni().find(function(i){ return i.mese===defMese; })||{};
  el.innerHTML =
    '<div class="page-header"><div class="page-title">'+(editMese?'Modifica mese':'Inserisci mese')+'</div></div>'+
    '<div class="card"><div class="card-title">Periodo</div>'+
      '<div class="month-picker-row"><select id="ins-mo" class="month-select">'+mOpts+'</select><select id="ins-yr" class="month-select" style="max-width:90px">'+yOpts+'</select></div>'+
      '<div class="card-title">Saldi</div>'+
      '<div class="form-group"><label class="form-label">'+nomi.bp+'</label><input id="ins-bp" type="number" step="0.01" class="form-control" placeholder="0.00" value="'+(existS.bp!==undefined?existS.bp:'')+'"></div>'+
      '<div class="form-group"><label class="form-label">'+nomi.libretto+'</label><input id="ins-lib" type="number" step="0.01" class="form-control" placeholder="0.00" value="'+(existS.libretto!==undefined?existS.libretto:'')+'"></div>'+
      '<div class="form-group"><label class="form-label">'+nomi.ing+'</label><input id="ins-ing" type="number" step="0.01" class="form-control" placeholder="0.00" value="'+(existS.ing!==undefined?existS.ing:'')+'"></div>'+
      '<div class="form-group"><label class="form-label">Note</label><input id="ins-note" type="text" class="form-control" placeholder="Facoltativo" value="'+(existS.note||'')+'"></div>'+
      '<div class="form-sep"></div>'+
      '<div class="card-title">Impegni</div>'+
      '<div class="form-row">'+
        '<div class="form-group"><label class="form-label">Rata mutuo</label><input id="ins-mut" type="number" step="0.01" class="form-control" placeholder="920" value="'+(existI.rata_mutuo!==undefined?existI.rata_mutuo:pr.rata_mutuo_mensile)+'"></div>'+
        '<div class="form-group"><label class="form-label">Spese ric.</label><input id="ins-ric" type="number" step="0.01" class="form-control" placeholder="0" value="'+(existI.spese_ricorrenti||0)+'"></div>'+
      '</div>'+
      '<div class="form-group"><label class="form-label">Spese straordinarie</label><input id="ins-str" type="number" step="0.01" class="form-control" placeholder="0" value="'+(existI.spese_straordinarie||0)+'"></div>'+
      '<button id="ins-save" class="btn-primary" style="margin-top:.25rem">Salva</button>'+
    '</div>';
  function getMese(){ return document.getElementById('ins-yr').value+'-'+document.getElementById('ins-mo').value; }
  function loadForMese(mese){
    var s=MCC.getSaldi().find(function(x){ return x.mese===mese; })||{};
    var i=MCC.getImpegni().find(function(x){ return x.mese===mese; })||{};
    var pr2=MCC.getParametri();
    document.getElementById('ins-bp').value  = s.bp!==undefined?s.bp:'';
    document.getElementById('ins-lib').value = s.libretto!==undefined?s.libretto:'';
    document.getElementById('ins-ing').value = s.ing!==undefined?s.ing:'';
    document.getElementById('ins-note').value= s.note||'';
    document.getElementById('ins-mut').value = i.rata_mutuo!==undefined?i.rata_mutuo:pr2.rata_mutuo_mensile;
    document.getElementById('ins-ric').value = i.spese_ricorrenti||0;
    document.getElementById('ins-str').value = i.spese_straordinarie||0;
  }
  document.getElementById('ins-mo').addEventListener('change', function(){ loadForMese(getMese()); });
  document.getElementById('ins-yr').addEventListener('change', function(){ loadForMese(getMese()); });
  document.getElementById('ins-save').addEventListener('click', function(){
    var mese = getMese();
    MCC.upsertSaldo(mese,
      parseFloat(document.getElementById('ins-bp').value)||0,
      parseFloat(document.getElementById('ins-lib').value)||0,
      parseFloat(document.getElementById('ins-ing').value)||0,
      document.getElementById('ins-note').value);
    MCC.upsertImpegno(mese,
      parseFloat(document.getElementById('ins-mut').value)||0,
      parseFloat(document.getElementById('ins-ric').value)||0,
      parseFloat(document.getElementById('ins-str').value)||0);
    MCC.showView('storico');
  });
};

MCC.renderStorico = function(){
  var el = document.getElementById('view-storico');
  var tutti = MCC.calcolaTutti().slice().reverse();
  if(!tutti.length){ el.innerHTML='<div class="page-header"><div class="page-title">Storico</div></div><div class="empty-msg">Nessun dato.</div>'; return; }
  var fmt = function(v){ return (v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); };
  var fmtM = function(s){ return new Date(s+'-01').toLocaleString('it-IT',{month:'long',year:'numeric'}); };
  var rows = tutti.map(function(m){
    var vc = m.var_totale===null?'neu':m.var_totale>=0?'pos':'neg';
    var vt = m.var_totale===null?'\u2014':(m.var_totale>=0?'+':'')+fmt(m.var_totale);
    var dot = m.alert==='OK'?'':m.alert==='Attenzione'?' <span style="color:#f59e0b;font-size:10px">\u25CF</span>':' <span style="color:var(--color-expense);font-size:10px">\u25CF</span>';
    return '<div class="month-row" data-mese="'+m.mese+'">'+
      '<div class="month-row-left"><div class="month-row-name">'+fmtM(m.mese)+dot+'</div>'+
      '<div class="month-row-total">'+fmt(m.totale)+' \u20AC &nbsp;\u00B7&nbsp; '+(m.stato||'Primo mese')+'</div></div>'+
      '<div class="month-row-right"><div class="month-row-var '+vc+'">'+vt+' \u20AC</div></div></div>';
  }).join('');
  el.innerHTML='<div class="page-header"><div class="page-title">Storico</div></div>'+rows;
  el.querySelectorAll('.month-row').forEach(function(r){
    r.addEventListener('click', function(){ MCC.renderInserisci(r.dataset.mese); MCC.showView('inserisci'); });
  });
};
(function(){
  var _charts = {};
  function _destroy(id){ if(_charts[id]){ _charts[id].destroy(); delete _charts[id]; } }
  var baseOpts = {
    responsive:true, maintainAspectRatio:false, animation:{duration:500},
    plugins:{ legend:{display:false}, tooltip:{backgroundColor:'#1a1d27',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#7b7c9e',bodyColor:'#e8e8f0',padding:10} },
    scales:{
      x:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6b7a99',font:{size:11}},border:{display:false}},
      y:{grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#6b7a99',font:{size:11}},border:{display:false}}
    }
  };
  function deepMerge(a,b){ var r=Object.assign({},a); Object.keys(b).forEach(function(k){ r[k]=(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))?deepMerge(a[k]||{},b[k]):b[k]; }); return r; }

  MCC.renderGrafici = function(){
    var el = document.getElementById('view-grafici');
    var tutti = MCC.calcolaTutti();
    var pr = MCC.getParametri();
    var nomi = pr.nomi||{bp:'BP',libretto:'Libretto',ing:'ING'};
    if(!tutti.length){ el.innerHTML='<div class="empty-msg">Nessun dato.</div>'; return; }
    var labels = tutti.map(function(m){ return new Date(m.mese+'-01').toLocaleString('it-IT',{month:'short',year:'2-digit'}); });
    el.innerHTML =
      '<div class="page-header"><div class="page-title">Grafici</div></div>'+
      '<div class="chart-wrap"><div class="chart-label">Totale conti nel tempo</div><div class="chart-container"><canvas id="cg-tot"></canvas></div></div>'+
      '<div class="chart-wrap"><div class="chart-label">Conti singoli</div><div class="chart-container"><canvas id="cg-conti"></canvas></div></div>'+
      '<div class="chart-wrap"><div class="chart-label">Variazione mensile</div><div class="chart-container"><canvas id="cg-var"></canvas></div></div>';
    if(typeof window.Chart !== 'function') return;
    requestAnimationFrame(function(){
      _destroy('cg-tot');
      var ctx=document.getElementById('cg-tot'); if(!ctx) return;
      _charts['cg-tot']=new window.Chart(ctx,{ type:'line', data:{ labels:labels, datasets:[{ data:tutti.map(function(m){ return m.totale; }), borderColor:'#00c9b8', backgroundColor:'rgba(0,201,184,.1)', borderWidth:2.5, pointRadius:3, tension:.35, fill:true }] }, options:baseOpts });
      _destroy('cg-conti');
      var ctx2=document.getElementById('cg-conti'); if(!ctx2) return;
      _charts['cg-conti']=new window.Chart(ctx2,{ type:'line', data:{ labels:labels, datasets:[
        { label:nomi.bp,       data:tutti.map(function(m){ return m.bp; }),       borderColor:'#00c9b8', backgroundColor:'transparent', borderWidth:2, pointRadius:2, tension:.35 },
        { label:nomi.libretto, data:tutti.map(function(m){ return m.libretto; }), borderColor:'#f59e0b', backgroundColor:'transparent', borderWidth:2, pointRadius:2, tension:.35 },
        { label:nomi.ing,      data:tutti.map(function(m){ return m.ing; }),      borderColor:'#6c63ff', backgroundColor:'transparent', borderWidth:2, pointRadius:2, tension:.35 }
      ] }, options:deepMerge(baseOpts,{ plugins:{ legend:{ display:true, labels:{ color:'#6b7a99', font:{size:11}, boxWidth:10, padding:12 } } } }) });
      _destroy('cg-var');
      var varData=tutti.map(function(m){ return m.var_totale; });
      var ctx3=document.getElementById('cg-var'); if(!ctx3) return;
      _charts['cg-var']=new window.Chart(ctx3,{ type:'bar', data:{ labels:labels, datasets:[{ data:varData, backgroundColor:varData.map(function(v){ return v===null?'rgba(255,255,255,.1)':v>=0?'rgba(0,217,126,.75)':'rgba(255,77,109,.75)'; }), borderRadius:4, borderSkipped:false }] }, options:deepMerge(baseOpts,{ barPercentage:.7, categoryPercentage:.8 }) });
    });
  };

  MCC.renderParametri = function(){
    var el = document.getElementById('view-parametri');
    var pr = MCC.getParametri();
    var nomi = pr.nomi||{bp:'BP',libretto:'Libretto',ing:'ING'};
    el.innerHTML =
      '<div class="page-header"><div class="page-title">Parametri</div></div>'+
      '<div class="card"><div class="card-title">Nomi conti</div>'+
        '<div class="form-row">'+
          '<div class="form-group"><label class="form-label">Conto 1</label><input id="pr-nbp"  type="text" class="form-control" value="'+nomi.bp+'"></div>'+
          '<div class="form-group"><label class="form-label">Conto 2</label><input id="pr-nlib" type="text" class="form-control" value="'+nomi.libretto+'"></div>'+
        '</div>'+
        '<div class="form-group"><label class="form-label">Conto 3</label><input id="pr-ning" type="text" class="form-control" value="'+nomi.ing+'"></div>'+
      '</div>'+
      '<div class="card"><div class="card-title">Soglie alert</div>'+
        '<div class="form-group"><label class="form-label">Soglia minima liquidit\u00E0 (\u20AC)</label><input id="pr-soglia" type="number" step="100" class="form-control" value="'+pr.soglia_minima_liquidita+'"></div>'+
        '<div class="form-group"><label class="form-label">Tolleranza alert giallo (%)</label><input id="pr-toll" type="number" step="1" min="0" max="100" class="form-control" value="'+Math.round(pr.tolleranza_giallo*100)+'"></div>'+
      '</div>'+
      '<div class="card"><div class="card-title">Impegni default</div>'+
        '<div class="form-group"><label class="form-label">Rata mutuo mensile (\u20AC)</label><input id="pr-mutuo" type="number" step="10" class="form-control" value="'+pr.rata_mutuo_mensile+'"></div>'+
        '<div class="form-group"><label class="form-label">Fondo sicurezza (\u20AC)</label><input id="pr-fondo" type="number" step="100" class="form-control" value="'+pr.fondo_sicurezza+'"></div>'+
      '</div>'+
      '<button id="pr-save" class="btn-primary">Salva parametri</button>'+
      '<div id="pr-msg" style="text-align:center;margin-top:.75rem;font-size:13px;color:var(--color-income);height:1.2em"></div>';
    document.getElementById('pr-save').addEventListener('click', function(){
      MCC.setParametri({
        soglia_minima_liquidita: parseFloat(document.getElementById('pr-soglia').value)||10000,
        rata_mutuo_mensile:      parseFloat(document.getElementById('pr-mutuo').value)||0,
        fondo_sicurezza:         parseFloat(document.getElementById('pr-fondo').value)||5000,
        tolleranza_giallo:       (parseFloat(document.getElementById('pr-toll').value)||10)/100,
        nomi:{ bp:document.getElementById('pr-nbp').value||'BP', libretto:document.getElementById('pr-nlib').value||'Libretto', ing:document.getElementById('pr-ning').value||'ING' }
      });
      document.getElementById('pr-msg').textContent='Salvato!';
      setTimeout(function(){ var m=document.getElementById('pr-msg'); if(m) m.textContent=''; },2000);
    });
  };
})();
(function(){
  var views = document.querySelectorAll('.view');
  var tabs  = document.querySelectorAll('.tab-item');
  var renderers = {
    dashboard: function(){ MCC.renderDashboard(); },
    inserisci: function(){ MCC.renderInserisci(null); },
    storico:   function(){ MCC.renderStorico(); },
    grafici:   function(){ MCC.renderGrafici(); },
    parametri: function(){ MCC.renderParametri(); }
  };
  function showView(name){
    views.forEach(function(v){ v.classList.remove('active'); });
    tabs.forEach(function(t){ t.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelector('[data-view="' + name + '"]').classList.add('active');
    renderers[name]();
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ showView(t.dataset.view); }); });
  MCC.showView = showView;
  showView('dashboard');
})();
</script>
