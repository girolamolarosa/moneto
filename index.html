<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1117">
<title>I Miei Conti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --color-bg:#0f1117;
  --color-surface:#1a1d27;
  --color-surface-2:#232736;
  --color-border:#2a2d3e;
  --color-accent:#6c63ff;
  --color-income:#00d97e;
  --color-expense:#ff4d6d;
  --color-text:#e8e8f0;
  --color-text-muted:#7b7c9e;
  --radius-card:14px;
  --radius-input:10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
  --tab-height: 56px;
}

html{height:100%;overflow:hidden}
body{
  font-family:'Inter',sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
  height:100%;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;-webkit-appearance:none}
input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none}

/* â"€â"€ TOP HEADER â"€â"€ */
.app-header{
  flex-shrink:0;
  background:var(--color-surface);
  border-bottom:1px solid var(--color-border);
  display:flex;
  align-items:center;
  justify-content:center;
  height:calc(50px + var(--safe-top));
  padding-top:var(--safe-top);
}
.header-title{
  font-size:1rem;
  font-weight:700;
  color:var(--color-text);
  letter-spacing:.01em;
}
.header-action{
  position:absolute;
  right:16px;
}

/* â"€â"€ SCROLL AREA â"€â"€ */
.view-content{
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:1rem;
  padding-bottom:calc(var(--tab-height) + var(--safe-bottom) + 1rem);
}

/* â"€â"€ BOTTOM TAB BAR â"€â"€ */
.bottom-tabs{
  flex-shrink:0;
  display:flex;
  background:var(--color-surface);
  border-top:1px solid var(--color-border);
  padding-bottom:var(--safe-bottom);
  height:calc(var(--tab-height) + var(--safe-bottom));
}
.tab-item{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  padding-top:6px;
  color:var(--color-text-muted);
  font-size:10px;
  font-weight:500;
  letter-spacing:.01em;
  transition:color .15s;
  position:relative;
  overflow:hidden;
}
.tab-item.active{color:var(--color-accent)}
.tab-icon{width:22px;height:22px;flex-shrink:0}

/* â"€â"€ CARDS â"€â"€ */
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:1.1rem;margin-bottom:.75rem}
.card-grid{display:flex;flex-direction:column;gap:.75rem;margin-bottom:1rem}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:1rem}
.kpi{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:.85rem .75rem}
.kpi-label{font-size:0.7rem;color:var(--color-text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem}
.kpi-value{font-size:1.1rem;font-weight:700;line-height:1.2}
.kpi-value.income{color:var(--color-income)}
.kpi-value.expense{color:var(--color-expense)}

/* â"€â"€ SECTION HEADER â"€â"€ */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.section-title{font-size:1rem;font-weight:600}

/* â"€â"€ BUTTONS â"€â"€ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;
  padding:.6rem 1.1rem;border-radius:var(--radius-input);
  font-size:.875rem;font-weight:600;border:none;
  min-height:44px;
  transition:opacity .12s,background .12s;
  white-space:nowrap;
  position:relative;
  overflow:hidden;
}
.btn-primary{background:var(--color-accent);color:#fff}
.btn-primary:active{opacity:.82}
.btn-danger{background:rgba(255,77,109,.15);color:var(--color-expense)}
.btn-danger:active{background:rgba(255,77,109,.28)}
.btn-ghost{background:var(--color-surface-2);color:var(--color-text-muted);border:1px solid var(--color-border)}
.btn-ghost:active{color:var(--color-text)}
.btn-sm{padding:.35rem .75rem;font-size:.8rem;min-height:36px}
.btn-icon{
  padding:.5rem;border-radius:8px;background:transparent;
  border:1px solid var(--color-border);color:var(--color-text-muted);
  min-height:36px;min-width:36px;
}
.btn-icon:active{color:var(--color-text);background:var(--color-surface-2)}

/* â"€â"€ TRANSACTION LIST â"€â"€ */
.tx-list{display:flex;flex-direction:column;gap:.5rem}
.tx-item{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:12px;padding:.85rem 1rem;
  display:flex;align-items:center;gap:.75rem;
}
.tx-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:.72rem;color:var(--color-text-muted);margin-top:2px}
.tx-amount{font-weight:700;font-size:.95rem;flex-shrink:0}
.tx-amount.income{color:var(--color-income)}
.tx-amount.expense{color:var(--color-expense)}
.tx-amount.transfer{color:var(--color-text-muted)}
.tx-actions{display:flex;gap:.25rem;flex-shrink:0}

/* â"€â"€ ACCOUNT CARD â"€â"€ */
.account-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);padding:1.1rem;display:flex;flex-direction:column;gap:.5rem;margin-bottom:.75rem}
.account-header{display:flex;align-items:center;gap:.6rem}
.account-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.account-name{font-weight:600;font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.account-type-badge{font-size:.68rem;font-weight:600;padding:.15rem .45rem;border-radius:99px;background:var(--color-surface-2);color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.04em}
.account-balance{font-size:1.5rem;font-weight:700;margin-top:.15rem}
.account-balance.negative{color:var(--color-expense)}
.account-actions{display:flex;gap:.4rem;margin-top:.25rem}

/* â"€â"€ FILTER BAR â"€â"€ */
.filter-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.85rem;align-items:center}
.filter-bar input,.filter-bar select{
  background:var(--color-surface);border:1px solid var(--color-border);
  border-radius:var(--radius-input);color:var(--color-text);
  padding:.45rem .65rem;font-size:.85rem;min-height:40px;
}
.filter-bar input:focus,.filter-bar select:focus{outline:2px solid var(--color-accent);outline-offset:-1px}

/* â"€â"€ MODAL (bottom sheet) â"€â"€ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;
  display:flex;align-items:flex-end;
}
.modal-overlay.hidden{display:none}
.modal{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:20px 20px 0 0;
  padding:1.25rem 1.25rem calc(1.25rem + var(--safe-bottom));
  width:100%;
  max-height:88vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
/* drag handle */
.modal::before{
  content:'';display:block;width:36px;height:4px;
  background:var(--color-border);border-radius:2px;
  margin:0 auto 1rem;
}
.modal-title{font-size:1.05rem;font-weight:700;margin-bottom:1.1rem}
.modal-footer{display:flex;gap:.5rem;justify-content:flex-end;margin-top:1.1rem}

/* â"€â"€ FORM â"€â"€ */
.form-group{margin-bottom:.9rem}
.form-label{display:block;font-size:.8rem;font-weight:600;color:var(--color-text-muted);margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.03em}
.form-control{
  width:100%;background:var(--color-surface-2);border:1px solid var(--color-border);
  border-radius:var(--radius-input);color:var(--color-text);
  padding:.65rem .85rem;font-size:1rem;min-height:48px;
}
.form-control:focus{outline:2px solid var(--color-accent);outline-offset:-1px;border-color:transparent}
.form-control option{background:var(--color-surface)}

/* â"€â"€ SWATCHES â"€â"€ */
.swatch-row{display:flex;gap:.5rem;flex-wrap:wrap}
.swatch{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .15s,transform .15s}
.swatch.selected{border-color:#fff;transform:scale(1.15)}

/* â"€â"€ CATEGORY LIST â"€â"€ */
.cat-list{display:flex;flex-direction:column;gap:.4rem}
.cat-item{display:flex;align-items:center;gap:.6rem;padding:.6rem .85rem;background:var(--color-surface-2);border-radius:10px;min-height:44px}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name{flex:1;font-size:.9rem}

/* â"€â"€ EMPTY STATE â"€â"€ */
.empty{text-align:center;padding:3rem 1rem;color:var(--color-text-muted);font-size:.9rem}

/* â"€â"€ SETTINGS â"€â"€ */
.settings-section{margin-bottom:1.5rem}
.settings-section-title{font-size:.78rem;font-weight:700;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem;padding-bottom:.5rem;border-bottom:1px solid var(--color-border)}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:.75rem 0;border-bottom:1px solid var(--color-border);min-height:52px}
.settings-row:last-child{border-bottom:none}

/* â"€â"€ ANIMATIONS â"€â"€ */
@keyframes viewEnter {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes sheetUp {
  from { transform:translateY(100%); }
  to   { transform:translateY(0); }
}
@keyframes sheetDown {
  from { transform:translateY(0); }
  to   { transform:translateY(100%); }
}
@keyframes tabBounce {
  0%   { transform:scale(1); }
  30%  { transform:scale(0.78); }
  70%  { transform:scale(1.18); }
  100% { transform:scale(1); }
}
@keyframes fadeInUp {
  from { opacity:0; transform:translateY(14px); }
  to   { opacity:1; transform:translateY(0); }
}
@keyframes _ripple {
  to { transform:scale(1); opacity:0; }
}
.tx-item, .account-card {
  animation: fadeInUp 200ms ease-out both;
  animation-delay: calc(var(--i, 0) * 52ms);
}
.ripple-wave {
  position:absolute; border-radius:50%; pointer-events:none;
  background:rgba(255,255,255,0.2);
  transform:scale(0);
  animation:_ripple 450ms ease-out forwards;
}

/* â"€â"€ TOAST (above tab bar) â"€â"€ */
.toast{
  position:fixed;
  bottom:calc(var(--tab-height) + var(--safe-bottom) + .75rem);
  left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--color-surface-2);border:1px solid var(--color-border);
  border-radius:99px;padding:.6rem 1.25rem;
  font-size:.875rem;font-weight:500;
  z-index:300;opacity:0;
  transition:opacity .2s,transform .2s;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--color-income);color:var(--color-income)}
.toast.error{border-color:var(--color-expense);color:var(--color-expense)}
</style>
</head>
<body>

<header class="app-header">
  <span class="header-title" id="header-title">Moneto</span>
</header>

<main class="view-content" id="view"></main>

<nav class="bottom-tabs">
  <a href="#dashboard" class="tab-item">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>

      <path d="M7 16V4m0 0L3 8m4-4l4 4"/><path d="M17 8v12m0 0l4-4m-4 4l-4-4"/>

  <a href="#budget" class="tab-item">

      <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/>

  <a href="#accounts" class="tab-item">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="7" cy="15" r="1" fill="currentColor"/>
    </svg>
    Conti
  </a>
  <a href="#settings" class="tab-item">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    Impostazioni
  </a>
</nav>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const COLORS = ['#6c63ff','#00d97e','#ff4d6d','#f59e0b','#60a5fa','#a78bfa','#34d399','#fb923c'];
const STORAGE = {
  accounts: 'miei_conti.accounts',
  categories: 'miei_conti.categories',
  transactions: 'miei_conti.transactions',
  settings: 'miei_conti.settings',
  budgets: 'miei_conti.budgets',
};

function _load(key, def) {
  try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; }
}
function _save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function getAccounts()     { return _load(STORAGE.accounts, []); }
function getCategories()   { return _load(STORAGE.categories, []); }
function getTransactions() { return _load(STORAGE.transactions, []); }
function getSettings()     { return _load(STORAGE.settings, { currency: '€' }); }
function getBudgets()      { return _load(STORAGE.budgets, []); }
function saveAccounts(v)     { _save(STORAGE.accounts, v); }
function saveCategories(v)   { _save(STORAGE.categories, v); }
function saveTransactions(v) { _save(STORAGE.transactions, v); }
function saveSettings(v)     { _save(STORAGE.settings, v); }
function saveBudgets(v)      { _save(STORAGE.budgets, v); }

const _CAT_EMOJI_MAP = [
  [/affitto|mutuo|condominio/,           'ðŸ '],
  [/cibo|spesa|supermercato|alimentari/, `ðŸ›'`],
  [/utenz|bollette?|abbonament/,         `ðŸ'¡`],
  [/trasport|benzina|bus|treno|auto/,    'ðŸšŒ'],
  [/salute|medic|farmac/,               `ðŸ'Š`],
  [/svago|uscite|cinema|ristorante/,    'ðŸŽ¬'],
  [/abbigliament|vestit|scarpe/,        `ðŸ'—`],
  [/formazione|istruzion|corso/,        'ðŸŽ"'],
  [/emergenz|fondo/,                    'ðŸ†˜'],
  [/risparmio|investiment/,             `ðŸ'°`],
  [/stipend|salari/,                    `ðŸ'¼`],
  [/altro/,                             'ðŸ"Œ'],
];
function categoryEmoji(name) {
  if (!name) return 'ðŸ·ï¸';
  const lower = name.toLowerCase();
  const found = _CAT_EMOJI_MAP.find(([re]) => re.test(lower));
  return found ? found[1] : 'ðŸ·ï¸';
}

function _esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function toIntegerCents(s) { return Math.round(parseFloat(s || 0) * 100); }
function fromIntegerCents(cents, currency) { return (currency || '€') + ' ' + (cents / 100).toFixed(2); }
function todayISO() { return new Date().toISOString().slice(0, 10); }
function currentMonth() { return new Date().toISOString().slice(0, 7); }
function formatDate(d) {
  if (!d) return '';
  const [y, m, day] = d.split('-');
  return `${day}/${m}/${y}`;
}

function accountBalance(acc, transactions) {
  let bal = acc.initial_balance_cents || 0;
  for (const t of transactions) {
    if (t.type === 'INCOME' && t.account_id === acc.id) bal += t.amount_cents;
    else if (t.type === 'EXPENSE' && t.account_id === acc.id) bal -= t.amount_cents;
    else if (t.type === 'TRANSFER') {
      if (t.account_id === acc.id) bal -= t.amount_cents;
      else if (t.to_account_id === acc.id) bal += t.amount_cents;
    }
  }
  return bal;
}

const _DEFAULT_CATS = [
  ['Affitto / Mutuo',          '#f59e0b'],
  ['Cibo & Spesa',             '#00d97e'],
  ['Utenze & Abbonamenti',     '#60a5fa'],
  ['Trasporti',                '#38bdf8'],
  ['Salute',                   '#ff4d6d'],
  ['Svago & Uscite',           '#a78bfa'],
  ['Abbigliamento',            '#fb923c'],
  ['Formazione',               '#34d399'],
  ['Fondo emergenze',          '#f97316'],
  ['Risparmio / Investimenti', '#6c63ff'],
];
const _OLD_CAT_NAMES = new Set(['Alimentari','Trasporti','Casa','Salute','Intrattenimento','Abbigliamento','Istruzione','Ristoranti','Altro','Stipendio','Svago']);

function initSeed() {
  if (!localStorage.getItem(STORAGE.accounts)) {
    saveAccounts([
      { id: crypto.randomUUID(), name: 'Conto Principale', type: 'corrente', initial_balance_cents: 0, color: '#6c63ff' },
      { id: crypto.randomUUID(), name: 'Risparmi', type: 'risparmio', initial_balance_cents: 0, color: '#00d97e' },
    ]);
  }
  if (!localStorage.getItem(STORAGE.categories)) {
    saveCategories(_DEFAULT_CATS.map(([name, color]) => ({ id: crypto.randomUUID(), name, color })));
  } else {
    // Migrate old default categories to new set
    const existing = getCategories();
    const existingNames = new Set(existing.map(c => c.name));
    const hasOld = existing.some(c => _OLD_CAT_NAMES.has(c.name));
    const hasNew = _DEFAULT_CATS.some(([n]) => existingNames.has(n));
    if (hasOld && !hasNew) {
      const kept = existing.filter(c => !_OLD_CAT_NAMES.has(c.name));
      const added = _DEFAULT_CATS.map(([name, color]) => ({ id: crypto.randomUUID(), name, color }));
      saveCategories([...added, ...kept]);
    }
  }
  if (!localStorage.getItem(STORAGE.settings))     saveSettings({ currency: '€' });
  if (!localStorage.getItem(STORAGE.transactions)) saveTransactions([]);
  if (!localStorage.getItem(STORAGE.budgets))      saveBudgets([]);
}

let _barChart = null;
let _dashAccId = '';

function last6Months() {
  const now = new Date();
  const result = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    result.push(d.toISOString().slice(0, 7));
  }
  return result;
}

let _toastTimer;
function showToast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = 'toast'; }, 2800);
}

function openModal(title, bodyHTML, footerHTML, onShow) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHTML;
  document.getElementById('modal-footer').innerHTML = footerHTML;
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  overlay.classList.remove('hidden');
  box.style.animation = 'none';
  void box.offsetWidth;
  box.style.animation = 'sheetUp 380ms cubic-bezier(0.32, 0.72, 0, 1) both';
  if (onShow) onShow();
}
function closeModal() {
  const box = document.getElementById('modal-box');
  box.style.animation = 'sheetDown 260ms cubic-bezier(0.32, 0.72, 0, 1) both';
  box.addEventListener('animationend', () => {
    document.getElementById('modal-overlay').classList.add('hidden');
    box.style.animation = '';
  }, { once: true });
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

function swatchHTML(selectedColor) {

}
function bindSwatches() {

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• DASHBOARD â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderDashboard() {
  if (_barChart) { _barChart.destroy(); _barChart = null; }
  const accounts = getAccounts();
  const transactions = getTransactions();
  const categories = getCategories();
  const { currency } = getSettings();
  const month = currentMonth();

  const accs = _dashAccId ? accounts.filter(a => a.id === _dashAccId) : accounts;
  const txs  = _dashAccId ? transactions.filter(t => t.account_id === _dashAccId) : transactions;

  let totalBalance = 0;
  accs.forEach(a => { totalBalance += accountBalance(a, transactions); });

  let monthIncome = 0, monthExpense = 0;
  txs.forEach(t => {
    if ((t.date || '').slice(0, 7) !== month) return;
    if (t.type === 'INCOME') monthIncome += t.amount_cents;
    else if (t.type === 'EXPENSE') monthExpense += t.amount_cents;
  });

  const catMap = Object.fromEntries(categories.map(c => [c.id, c]));
  const accMap = Object.fromEntries(accounts.map(a => [a.id, a]));

  const recent = [...txs].sort((a, b) => (b.date || '') > (a.date || '') ? 1 : -1).slice(0, 5);

  const balClass = totalBalance < 0 ? 'expense' : totalBalance > 0 ? 'income' : '';

  let recentHTML = recent.length === 0
    ? '<div class="empty">Nessuna transazione</div>'
    : recent.map((t, _i) => {
        const cat = catMap[t.category_id];
        const acc = accMap[t.account_id];
        const toAcc = t.to_account_id ? accMap[t.to_account_id] : null;
        const dotColor = cat ? cat.color : (t.type === 'INCOME' ? '#00d97e' : t.type === 'EXPENSE' ? '#ff4d6d' : '#7b7c9e');
        const amtClass = t.type === 'INCOME' ? 'income' : t.type === 'EXPENSE' ? 'expense' : 'transfer';
        const amtPrefix = t.type === 'INCOME' ? '+' : t.type === 'EXPENSE' ? '-' : '⇄';
        const metaParts = [formatDate(t.date), acc ? _esc(acc.name) : ''];
        if (toAcc) metaParts.push('→ ' + _esc(toAcc.name));
        return `<div class="tx-item" style="--i:${_i}">
          <div class="tx-dot" style="background:${dotColor}"></div>
          <div class="tx-info">
            <div class="tx-desc">${_esc(t.description || '—')}</div>
            <div class="tx-meta">${metaParts.filter(Boolean).join(' · ')}</div>
          </div>
          <div class="tx-amount ${amtClass}">${amtPrefix}${fromIntegerCents(t.amount_cents, currency)}</div>
        </div>`;
      }).join('');

  const months6 = last6Months();
  const chartIncome  = months6.map(m => txs.filter(t => t.type === 'INCOME'  && (t.date || '').slice(0, 7) === m).reduce((s, t) => s + t.amount_cents, 0) / 100);
  const chartExpense = months6.map(m => txs.filter(t => t.type === 'EXPENSE' && (t.date || '').slice(0, 7) === m).reduce((s, t) => s + t.amount_cents, 0) / 100);
  const chartDiff    = chartIncome.map((v, i) => Math.round((v - chartExpense[i]) * 100) / 100);
  const chartLabels  = months6.map(m => { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleString('it-IT', { month: 'short', year: '2-digit' }); });

  const tabsHTML = accounts.length === 0 ? '' : (() => {
    const allActive = _dashAccId === '';
    let s = '<div id="dash-acc-tabs" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:1rem;scrollbar-width:none;-webkit-overflow-scrolling:touch">';
    s += `<button class="dash-acc-tab" data-acc-id="" style="background:${allActive ? 'var(--color-accent);color:#fff' : 'var(--color-surface-2);color:var(--color-text-muted)'};border:none;padding:.35rem .75rem;border-radius:8px;font-size:.8rem;cursor:pointer;flex-shrink:0;white-space:nowrap">Tutti</button>`;
    accounts.forEach(a => {
      const on = _dashAccId === a.id;
      s += `<button class="dash-acc-tab" data-acc-id="${_esc(a.id)}" style="background:${on ? 'var(--color-accent);color:#fff' : 'var(--color-surface-2);color:var(--color-text-muted)'};border:none;padding:.35rem .75rem;border-radius:8px;font-size:.8rem;cursor:pointer;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px"><span style="width:7px;height:7px;border-radius:50%;background:${a.color || '#6c63ff'};flex-shrink:0"></span>${_esc(a.name)}</button>`;
    });
    s += '</div>';
    return s;
  })();

  document.getElementById('view').innerHTML = `${tabsHTML}
    <div class="kpi-row">
      <div class="kpi">
        <div class="kpi-label">Saldo Totale</div>
        <div class="kpi-value ${balClass}">${fromIntegerCents(totalBalance, currency)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Entrate (mese)</div>
        <div class="kpi-value income">${fromIntegerCents(monthIncome, currency)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Uscite (mese)</div>
        <div class="kpi-value expense">${fromIntegerCents(monthExpense, currency)}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:1.5rem">
      <div class="section-title" style="margin-bottom:1rem;font-size:0.95rem">Entrate vs Uscite — ultimi 6 mesi</div>
      <div style="position:relative;height:220px"><canvas id="dash-bar-chart"></canvas></div>
    </div>
    <div class="section-header">
      <div class="section-title">Ultime transazioni</div>
      <a href="#transactions" class="btn btn-ghost btn-sm">Vedi tutte</a>
    </div>
    <div class="tx-list">${recentHTML}</div>`;

  document.querySelectorAll('.dash-acc-tab').forEach(btn => {
    btn.addEventListener('click', () => { _dashAccId = btn.dataset.accId; renderDashboard(); });
  });

  if (typeof window.Chart === 'function') {
    requestAnimationFrame(() => {
      const canvas = document.getElementById('dash-bar-chart');
      if (!canvas || !canvas.isConnected) return;
      _barChart = new window.Chart(canvas, {
        type: 'bar',
        data: {
          labels: chartLabels,
          datasets: [
            { label: 'Entrate',    data: chartIncome,  backgroundColor: 'rgba(0,217,126,0.7)',  borderRadius: 6, borderSkipped: false },
            { label: 'Uscite',     data: chartExpense, backgroundColor: 'rgba(255,77,109,0.7)', borderRadius: 6, borderSkipped: false },
            { label: 'Differenza', data: chartDiff,    backgroundColor: chartDiff.map(v => v >= 0 ? 'rgba(245,158,11,0.75)' : 'rgba(245,158,11,0.35)'), borderRadius: 6, borderSkipped: false },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, labels: { color: '#7b7c9e', font: { family: 'Inter, sans-serif', size: 12 }, boxWidth: 12, padding: 16 } },
            tooltip: {
              backgroundColor: '#1a1d27',
              borderColor: 'rgba(255,255,255,0.1)',
              borderWidth: 1,
              titleColor: '#7b7c9e',
              bodyColor: '#e8e8f0',
              callbacks: {
                label: ctx => {
                  const sign = ctx.dataset.label === 'Differenza' && ctx.raw >= 0 ? '+' : '';
                  return ` ${sign}${currency}${ctx.raw.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
                },
              },
            },
          },
          scales: {
            x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#7b7c9e', font: { family: 'Inter, sans-serif', size: 11 } }, border: { display: false } },
            y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#7b7c9e', font: { family: 'Inter, sans-serif', size: 11 }, callback: v => `${currency}${v.toLocaleString('it-IT')}` }, border: { display: false } },
          },
          barPercentage: 0.6,
          categoryPercentage: 0.75,
        },
      });
    });
  }
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• TRANSACTIONS â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderTransactions() {
  const accounts = getAccounts();
  const categories = getCategories();
  const { currency } = getSettings();
  const catMap = Object.fromEntries(categories.map(c => [c.id, c]));
  const accMap = Object.fromEntries(accounts.map(a => [a.id, a]));

  let filterMonth = currentMonth();
  let filterType = 'ALL';
  let filterAccount = 'ALL';

  function filtered() {
    const transactions = getTransactions();
    return transactions.filter(t => {
      if (filterMonth && (t.date || '').slice(0, 7) !== filterMonth) return false;
      if (filterType !== 'ALL' && t.type !== filterType) return false;
      if (filterAccount !== 'ALL' && t.account_id !== filterAccount) return false;
      return true;
    }).sort((a, b) => (b.date || '') > (a.date || '') ? 1 : -1);
  }

  function listHTML() {
    const txs = filtered();
    if (txs.length === 0) return '<div class="empty">Nessuna transazione trovata</div>';
    return '<div class="tx-list">' + txs.map((t, _i) => {
      const cat = catMap[t.category_id];
      const acc = accMap[t.account_id];
      const toAcc = t.to_account_id ? accMap[t.to_account_id] : null;
      const dotColor = cat ? cat.color : (t.type === 'INCOME' ? '#00d97e' : t.type === 'EXPENSE' ? '#ff4d6d' : '#7b7c9e');
      const amtClass = t.type === 'INCOME' ? 'income' : t.type === 'EXPENSE' ? 'expense' : 'transfer';
      const amtPrefix = t.type === 'INCOME' ? '+' : t.type === 'EXPENSE' ? '-' : 'â‡„';
      const metaParts = [formatDate(t.date)];
      if (acc) metaParts.push(_esc(acc.name));
      if (toAcc) metaParts.push(`â†' ` + _esc(toAcc.name));
      if (cat) metaParts.push(categoryEmoji(cat.name) + ' ' + _esc(cat.name));
      return `<div class="tx-item" style="--i:${Math.min(_i, 9)}">
        <div class="tx-dot" style="background:${dotColor}"></div>
        <div class="tx-info">
          <div class="tx-desc">${_esc(t.description || 'â€"')}</div>
          <div class="tx-meta">${metaParts.join(' Â· ')}</div>
        </div>
        <div class="tx-amount ${amtClass}">${amtPrefix}${fromIntegerCents(t.amount_cents, currency)}</div>
        <div class="tx-actions">
          <button class="btn-icon" onclick="editTx('${t.id}')" title="Modifica">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon" onclick="deleteTx('${t.id}')" title="Elimina">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>`;
    }).join('') + '</div>';
  }

  const accOptions = accounts.map(a => `<option value="${a.id}">${_esc(a.name)}</option>`).join('');

  document.getElementById('view').innerHTML = `
    <div class="section-header">
      <div class="section-title">Transazioni</div>
      <button class="btn btn-primary btn-sm" onclick="addTx()">+ Aggiungi</button>
    </div>
    <div class="filter-bar">
      <input type="month" id="f-month" value="${filterMonth}">
      <select id="f-type">
        <option value="ALL">Tutti i tipi</option>
        <option value="INCOME">Entrata</option>
        <option value="EXPENSE">Uscita</option>
        <option value="TRANSFER">Trasferimento</option>
      </select>
      <select id="f-acc">
        <option value="ALL">Tutti i conti</option>
        ${accOptions}
      </select>
    </div>
    <div id="tx-list-container">${listHTML()}</div>
  `;

  function refreshList() { document.getElementById('tx-list-container').innerHTML = listHTML(); }

  document.getElementById('f-month').addEventListener('change', e => { filterMonth = e.target.value; refreshList(); });
  document.getElementById('f-type').addEventListener('change', e => { filterType = e.target.value; refreshList(); });
  document.getElementById('f-acc').addEventListener('change', e => { filterAccount = e.target.value; refreshList(); });
}

window.onTxTypeChange = function() {
  const type = document.getElementById('tx-type').value;
  document.getElementById('tx-toacc-group').style.display = type === 'TRANSFER' ? '' : 'none';
  document.getElementById('tx-cat-group').style.display = type === 'TRANSFER' ? 'none' : '';
};

function saveTxFromModal(existingId) {
  const date = document.getElementById('tx-date').value;
  const type = document.getElementById('tx-type').value;
  const amount = document.getElementById('tx-amount').value;
  const account_id = document.getElementById('tx-account').value;
  const to_account_id = type === 'TRANSFER' ? document.getElementById('tx-toaccount').value : undefined;
  const category_id = type !== 'TRANSFER' ? (document.getElementById('tx-category').value || undefined) : undefined;
  const description = document.getElementById('tx-desc').value.trim();

  if (!date || !amount || !account_id) { showToast('Compila tutti i campi obbligatori', 'error'); return; }
  if (type === 'TRANSFER' && to_account_id === account_id) { showToast('I conti devono essere diversi', 'error'); return; }

  const amount_cents = toIntegerCents(amount);
  if (amount_cents <= 0) { showToast('Importo non valido', 'error'); return; }

  const txs = getTransactions();
  if (existingId) {
    const idx = txs.findIndex(t => t.id === existingId);
    if (idx !== -1) {
      txs[idx] = { ...txs[idx], date, type, amount_cents, account_id, to_account_id, category_id, description };
    }
  } else {
    txs.push({ id: crypto.randomUUID(), date, type, amount_cents, account_id, to_account_id, category_id, description });
  }
  saveTransactions(txs);
  closeModal();
  showToast(existingId ? 'Transazione aggiornata' : 'Transazione aggiunta');
  renderTransactions();
}

window.addTx = function() {
  openModal('Nuova transazione', txModalBody(null),
    `<button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
     <button class="btn btn-primary" onclick="saveTxFromModal()">Salva</button>`);
};

window.editTx = function(id) {
  const tx = getTransactions().find(t => t.id === id);
  if (!tx) return;
  openModal('Modifica transazione', txModalBody(tx),
    `<button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
     <button class="btn btn-primary" onclick="saveTxFromModal('${id}')">Salva</button>`);
};

window.deleteTx = function(id) {
  const txs = getTransactions().filter(t => t.id !== id);
  saveTransactions(txs);
  showToast('Transazione eliminata');
  renderTransactions();
};

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• ACCOUNTS â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

function saveAccountFromModal(existingId) {
  const name = document.getElementById('acc-name').value.trim();
  const type = document.getElementById('acc-type').value;
  const balance = document.getElementById('acc-balance').value;
  const color = document.getElementById('sel-color').value;
  if (!name) { showToast('Inserisci un nome', 'error'); return; }
  const initial_balance_cents = toIntegerCents(balance);
  const accs = getAccounts();
  if (existingId) {
    const idx = accs.findIndex(a => a.id === existingId);
    if (idx !== -1) accs[idx] = { ...accs[idx], name, type, initial_balance_cents, color };
  } else {
    accs.push({ id: crypto.randomUUID(), name, type, initial_balance_cents, color });
  }
  saveAccounts(accs);
  closeModal();
  showToast(existingId ? 'Conto aggiornato' : 'Conto aggiunto');
  renderAccounts();
}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• SETTINGS â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */

        <button class="btn-icon btn-sm" onclick="deleteCat('${c.id}')" title="Elimina">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>`).join('') + '</div>';
  }

  document.getElementById('view').innerHTML = `
    <div class="section-title" style="margin-bottom:1.5rem">Impostazioni</div>

    <div class="settings-section">
      <div class="settings-section-title">Valuta</div>
      <div class="settings-row">
        <span>Simbolo valuta</span>
        <select id="currency-sel" class="form-control" style="width:auto">
          <option value="€"${currency==='€'?' selected':''}>€ Euro</option>
          <option value="$"${currency==='$'?' selected':''}>$ Dollaro</option>
          <option value="Â£"${currency==='Â£'?' selected':''}>Â£ Sterlina</option>
        </select>
      </div>
      <div style="margin-top:0.75rem">
        <button class="btn btn-primary btn-sm" onclick="saveCurrencySetting()">Salva valuta</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Categorie</div>
      <div id="cat-list-container">${catListHTML()}</div>
      <div style="margin-top:0.75rem">
        <button class="btn btn-ghost btn-sm" onclick="addCat()">+ Aggiungi categoria</button>
      </div>
    </div>

    <div class="settings-section">
      <div class="settings-section-title">Import / Export</div>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem">
        <button class="btn btn-ghost" onclick="exportCSV()">Esporta CSV per Moneto</button>
        <label class="btn btn-ghost" style="cursor:pointer">
          Importa CSV da Moneto
          <input type="file" accept=".csv" style="display:none" onchange="importCSV(this)">
        </label>

    <div class="settings-section">

      <button class="btn btn-danger" onclick="resetAll()">Cancella tutti i dati</button>

}

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• CSV EXPORT â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
window.exportCSV = function() {
  const transactions = getTransactions();
  const accounts = getAccounts();
  const categories = getCategories();
  const accMap = Object.fromEntries(accounts.map(a => [a.id, a]));
  const catMap = Object.fromEntries(categories.map(c => [c.id, c]));

  const header = 'Data;Tipo;Importo;Conto;ContoDestinazione;Categoria;Descrizione';
  // Export initial balances first so the other side can reconstruct them
  const ibRows = accounts
    .filter(a => a.initial_balance_cents)
    .map(a => [
      '', 'INITIAL_BALANCE',
      (a.initial_balance_cents / 100).toFixed(2),
      a.name, '', '', '',
    ].join(';'));
  const rows = transactions.map(t => {
    const acc = accMap[t.account_id];
    const toAcc = t.to_account_id ? accMap[t.to_account_id] : null;
    const cat = t.category_id ? catMap[t.category_id] : null;
    return [
      t.date || '',
      t.type,
      (t.amount_cents / 100).toFixed(2),
      acc ? acc.name : '',
      toAcc ? toAcc.name : '',
      cat ? cat.name : '',
      t.description || '',
    ].join(';');
  });

  const csv = 'ï»¿' + header + '\n' + [...ibRows, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'moneto_export.csv';
  a.click();
  URL.revokeObjectURL(url);
  showToast('CSV esportato');
};

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• CSV IMPORT â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
window.importCSV = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    let text = e.target.result;
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    if (lines.length < 2) { showToast('File CSV vuoto', 'error'); return; }

    const accounts = getAccounts();
    const categories = getCategories();
    const transactions = getTransactions();

    const accByName = Object.fromEntries(accounts.map(a => [a.name.toLowerCase(), a]));
    const catByName = Object.fromEntries(categories.map(c => [c.name.toLowerCase(), c]));

    const dedupSet = new Set(transactions.map(t => {
      const acc = accounts.find(a => a.id === t.account_id);
      return `${t.date}|${t.amount_cents}|${acc ? acc.name : ''}|${t.type}`;
    }));

    let added = 0, skipped = 0;

    for (let i = 1; i < lines.length; i++) {
      const parts = lines[i].split(';');
      if (parts.length < 7) continue;
      const [date, type, importoStr, contoName, contoDestName, catName, description] = parts;
      if (!type || !importoStr || !contoName) continue;

      // Handle initial balance rows
      if (type.toUpperCase() === 'INITIAL_BALANCE') {
        const ibCents = toIntegerCents(importoStr);
        let acc = accByName[contoName.toLowerCase()];
        if (acc) {
          acc.initial_balance_cents = ibCents;
        } else {
          acc = { id: crypto.randomUUID(), name: contoName, type: 'corrente', initial_balance_cents: ibCents, color: COLORS[accounts.length % COLORS.length] };
          accounts.push(acc);
          accByName[contoName.toLowerCase()] = acc;
        }
        continue;
      }

      if (!date) continue;

      const amount_cents = toIntegerCents(importoStr);
      const dedupKey = `${date}|${amount_cents}|${contoName}|${type}`;
      if (dedupSet.has(dedupKey)) { skipped++; continue; }

      let acc = accByName[contoName.toLowerCase()];
      if (!acc) {
        acc = { id: crypto.randomUUID(), name: contoName, type: 'corrente', initial_balance_cents: 0, color: COLORS[accounts.length % COLORS.length] };
        accounts.push(acc);
        accByName[contoName.toLowerCase()] = acc;
      }

      let toAccId;
      if (type === 'TRANSFER' && contoDestName) {
        let toAcc = accByName[contoDestName.toLowerCase()];
        if (!toAcc) {
          toAcc = { id: crypto.randomUUID(), name: contoDestName, type: 'corrente', initial_balance_cents: 0, color: COLORS[accounts.length % COLORS.length] };
          accounts.push(toAcc);
          accByName[contoDestName.toLowerCase()] = toAcc;
        }
        toAccId = toAcc.id;
      }

      let catId;
      if (catName && type !== 'TRANSFER') {
        let cat = catByName[catName.toLowerCase()];
        if (!cat) {
          cat = { id: crypto.randomUUID(), name: catName, color: COLORS[categories.length % COLORS.length] };
          categories.push(cat);
          catByName[catName.toLowerCase()] = cat;
        }
        catId = cat.id;
      }

      transactions.push({
        id: crypto.randomUUID(),
        date, type, amount_cents,
        account_id: acc.id,
        to_account_id: toAccId,
        category_id: catId,
        description: description || '',
      });
      dedupSet.add(dedupKey);
      added++;
    }

    saveAccounts(accounts);
    saveCategories(categories);
    saveTransactions(transactions);
    input.value = '';
    showToast(`Import completato: ${added} aggiunte, ${skipped} duplicate`);
    navigate(currentView);
  };
  reader.readAsText(file, 'utf-8');
};

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• BUDGET â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
function renderBudget() {
  const categories = getCategories();
  const transactions = getTransactions();
  const { currency } = getSettings();
  const month = currentMonth();

  const monthLabel = (() => {
    const [y, m] = month.split('-');
    return new Date(+y, +m - 1, 1).toLocaleString('it-IT', { month: 'long', year: 'numeric' });
  })();

  // Spending per category this month
  const spent = {};
  transactions.forEach(t => {
    if (t.type !== 'EXPENSE' || (t.date || '').slice(0, 7) !== month) return;
    spent[t.category_id || '__none__'] = (spent[t.category_id || '__none__'] || 0) + t.amount_cents;
  });

  const budgets = getBudgets().filter(b => b.month === month);
  const budgetMap = Object.fromEntries(budgets.map(b => [b.category_id, b]));

  function rowsHTML() {
    const expCats = categories.filter(c => c.type !== 'INCOME');
    if (expCats.length === 0) return '<div class="empty">Nessuna categoria di uscita</div>';
    return expCats.map((cat, _i) => {
      const s = spent[cat.id] || 0;
      const b = budgetMap[cat.id];
      const limit = b ? b.limit_cents : 0;
      const pct = limit > 0 ? Math.min(Math.round(s / limit * 100), 100) : 0;
      const barColor = pct >= 100 ? 'var(--color-expense)' : pct >= 80 ? '#f59e0b' : 'var(--color-income)';
      const emoji = categoryEmoji(cat.name);
      return `
        <div class="tx-item" style="--i:${_i};flex-direction:column;align-items:stretch;gap:8px;cursor:pointer" onclick="setBudgetLimit('${cat.id}','${_esc(cat.name)}')">
          <div style="display:flex;align-items:center;gap:8px">
            <div class="tx-dot" style="background:${cat.color}"></div>
            <span style="font-size:15px">${emoji}</span>
            <span style="flex:1;font-size:0.9rem;font-weight:500">${_esc(cat.name)}</span>
            <span style="font-size:0.85rem;font-weight:600;color:var(--color-expense)">${fromIntegerCents(s, currency)}</span>
            ${limit > 0 ? `<span style="font-size:0.75rem;color:var(--color-text-muted)">/ ${fromIntegerCents(limit, currency)}</span>` : '<span style="font-size:0.72rem;color:var(--color-text-muted)">nessun limite</span>'}
          </div>
          ${limit > 0 ? `
            <div style="height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden">
              <div style="height:100%;width:${pct}%;background:${barColor};border-radius:3px;transition:width .4s ease"></div>
            </div>
            ${pct >= 100 ? `<div style="font-size:0.75rem;color:var(--color-expense)">âš ï¸ Sforamento di ${fromIntegerCents(s - limit, currency)}</div>` :
              pct >= 80 ? `<div style="font-size:0.75rem;color:#f59e0b">âš ï¸ ${100 - pct}% rimanente</div>` : ''}
          ` : ''}
        </div>`;
    }).join('');
  }

  document.getElementById('view').innerHTML = `
    <div class="section-header">
      <div class="section-title">Budget</div>
      <span style="font-size:0.82rem;color:var(--color-text-muted)">${monthLabel}</span>
    </div>
    <p style="font-size:0.8rem;color:var(--color-text-muted);margin-bottom:1rem">Tocca una categoria per impostare il limite mensile.</p>
    <div class="tx-list" id="budget-rows">${rowsHTML()}</div>
  `;
}

window.setBudgetLimit = function(catId, catName) {
  const { currency } = getSettings();
  const month = currentMonth();
  const budgets = getBudgets();
  const existing = budgets.find(b => b.category_id === catId && b.month === month);
  const currentVal = existing ? (existing.limit_cents / 100).toFixed(2) : '';
  openModal(`Limite per ${catName}`,
    `<div class="form-group">
       <label class="form-label">Limite mensile (${currency})</label>
       <input type="number" class="form-control" id="budget-limit-val" min="0" step="0.01" value="${currentVal}" placeholder="es. 300.00">
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Annulla</button>
     ${existing ? `<button class="btn btn-danger btn-sm" onclick="removeBudgetLimit('${catId}')">Rimuovi</button>` : ''}
     <button class="btn btn-primary" onclick="saveBudgetLimit('${catId}')">Salva</button>`
  );
  setTimeout(() => document.getElementById('budget-limit-val')?.focus(), 50);
};

window.saveBudgetLimit = function(catId) {
  const val = document.getElementById('budget-limit-val').value;
  const limit_cents = toIntegerCents(val);
  if (limit_cents <= 0) { showToast('Inserisci un importo valido', 'error'); return; }
  const month = currentMonth();
  const budgets = getBudgets();
  const idx = budgets.findIndex(b => b.category_id === catId && b.month === month);
  if (idx !== -1) {
    budgets[idx].limit_cents = limit_cents;
  } else {
    budgets.push({ id: crypto.randomUUID(), category_id: catId, month, limit_cents });
  }
  saveBudgets(budgets);
  closeModal();
  showToast('Limite salvato');
  renderBudget();
};

window.removeBudgetLimit = function(catId) {
  const month = currentMonth();
  saveBudgets(getBudgets().filter(b => !(b.category_id === catId && b.month === month)));
  closeModal();
  showToast('Limite rimosso');
  renderBudget();
};

/* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• ROUTER â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
let currentView = 'dashboard';
const VIEWS = {
  dashboard: renderDashboard,
  transactions: renderTransactions,
  budget: renderBudget,
  accounts: renderAccounts,
  settings: renderSettings,
};

function navigate(view) {
  if (!VIEWS[view]) view = 'dashboard';
  currentView = view;
  renderNav(view);
  const el = document.getElementById('view');
  el.style.animation = 'none';
  VIEWS[view]();
  void el.offsetWidth;
  el.style.animation = 'viewEnter 220ms ease-out both';
}

function onHashChange() {
  const hash = location.hash.replace('#', '') || 'dashboard';
  navigate(hash);
}

window.addEventListener('hashchange', onHashChange);

initSeed();
onHashChange();

// Tab spring — whole tab item bounces on click
document.querySelectorAll('.tab-item').forEach(a => {
  a.addEventListener('click', () => {
    a.style.animation = 'none';
    void a.offsetWidth;
    a.style.animation = 'tabBounce 320ms cubic-bezier(0.34,1.56,0.64,1) both';
  });
});

// Ripple on touch for buttons and tab items
document.addEventListener('touchstart', e => {
  const target = e.target.closest('.btn, .tab-item');
  if (!target) return;
  const touch = e.touches[0];
  const rect  = target.getBoundingClientRect();
  const size  = Math.max(rect.width, rect.height) * 2.4;
  const wave  = document.createElement('span');
  wave.className = 'ripple-wave';
  wave.style.cssText = `width:${size}px;height:${size}px;`
    + `left:${touch.clientX - rect.left - size / 2}px;`
    + `top:${touch.clientY - rect.top  - size / 2}px`;
  target.appendChild(wave);
  wave.addEventListener('animationend', () => wave.remove(), { once: true });
}, { passive: true });

// Card press via box-shadow (safe: not blocked by fadeInUp animation fill-mode)
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.tx-item, .account-card, .kpi');
  if (!card) return;
  card.style.transition = 'box-shadow 60ms ease';
  card.style.boxShadow  = 'inset 0 0 0 999px rgba(0,0,0,0.13)';
}, { passive: true });
const _cardRelease = e => {
  const card = e.target.closest('.tx-item, .account-card, .kpi');
  if (!card) return;
  card.style.transition = 'box-shadow 220ms ease';
  card.style.boxShadow  = '';
};
document.addEventListener('touchend',    _cardRelease, { passive: true });
document.addEventListener('touchcancel', _cardRelease, { passive: true });
</script>
